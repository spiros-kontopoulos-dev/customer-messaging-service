services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: kubbly_mock
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kubbly_mock"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - kubbly_mock_pgdata:/var/lib/postgresql/data

volumes:
  kubbly_mock_pgdata:
